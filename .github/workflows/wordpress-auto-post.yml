name: WordPress記事自動投稿

on:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00) に実行
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check IP (temporary)
        run: curl -s https://api.ipify.org

      - name: Test WordPress API (temporary)
        run: |
          curl -v \
            -A "Mozilla/5.0" \
            "https://www.omotya-museum.com/wp-json/wp/v2/posts"

      - name: Generate article and post to WordPress
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/generate_and_post.py
