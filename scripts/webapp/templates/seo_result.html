{% extends "base.html" %}
{% block title %}SEO情報の書き込み | おもちゃミュージアム{% endblock %}
{% block heading %}SEO情報の書き込み結果{% endblock %}
{% block content %}

<div class="card" style="max-width:820px;">
  <p id="status">CocoonのSEO欄に書き込み中...</p>
  <div id="logs" style="background:#111;color:#0f0;padding:16px;border-radius:8px;min-height:60px;max-height:240px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;font-size:0.8rem;"></div>
  <div id="summary" style="margin-top:16px;"></div>
  <a class="link" href="/seo" style="display:inline-block;margin-top:16px;">&laquo; SEO情報の一覧に戻る</a>
</div>

<script>
const jobId = "{{ job_id }}";

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}

async function poll() {
  const res = await fetch(`/jobs/${jobId}/data`);
  const data = await res.json();
  document.getElementById("logs").textContent = data.logs.join("\n");

  if (data.status === "done") {
    const results = data.result.results;
    const ok = results.filter(function (r) { return r.ok; }).length;
    document.getElementById("status").textContent = `完了: ${ok}/${results.length}件のSEO欄を更新しました。`;
    let html = "<table><tr><th>記事</th><th>結果</th></tr>";
    results.forEach(function (r) {
      html += `<tr><td>${escapeHtml(r.title)}</td><td>${r.ok
        ? '<span class="badge ok">更新済み</span>'
        : '<span class="badge ng">失敗</span> <span style="font-size:0.8rem;color:#b91c1c;">' + escapeHtml(r.error) + "</span>"}</td></tr>`;
    });
    html += "</table>";
    document.getElementById("summary").innerHTML = html;
    return;
  }
  if (data.status === "error") {
    document.getElementById("status").innerHTML = `<span style="color:#c00;">エラーが発生しました: ${escapeHtml(data.error)}</span>`;
    return;
  }
  setTimeout(poll, 1500);
}
poll();
</script>

{% endblock %}
