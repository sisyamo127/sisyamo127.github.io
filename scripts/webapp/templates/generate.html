{% extends "base.html" %}
{% block title %}記事生成 | おもちゃミュージアム{% endblock %}
{% block heading %}記事生成{% endblock %}
{% block content %}

<div class="card" style="max-width:560px;">
  <form action="/generate" method="post">
    <label for="topic">テーマ(空欄ならAIにお任せ)</label>
    <input type="text" id="topic" name="topic" placeholder="例: 冬におすすめの外遊びおもちゃ">

    <label for="category">カテゴリー(空欄ならAIが選択)</label>
    <select id="category" name="category">
      <option value="">(AIにお任せ)</option>
      {% for c in categories %}
      <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>

    <div class="checkbox-row">
      <input type="checkbox" id="include_amazon" name="include_amazon" checked>
      <label for="include_amazon" style="margin:0;font-weight:normal;">Amazon商品紹介を含める</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="include_image" name="include_image" checked>
      <label for="include_image" style="margin:0;font-weight:normal;">アイキャッチ画像を自動設定する(Unsplash)</label>
    </div>

    <button type="submit" class="btn" style="margin-top:20px;">記事を生成</button>
  </form>
</div>

{% endblock %}
